name: IKPU qidirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ikpu-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "реклама" "размещение рекламы" "интернет реклама" "объявлен"; do
            for u in "https://tasnif.soliq.uz/api/cls-api/elasticsearch/search?search=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&size=30&page=0&lang=ru" ; do
              r=$(curl -s -m 20 -A "Mozilla/5.0" "$u" | head -c 6000 | tr -d '\n' | sed 's/%/%25/g')
              echo "::notice title=$q::$r"
            done
          done
