name: Android do'kon fayli (AAB)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-release.yml', '.github/android-release.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: qtvyjmiqoknpnlilpfpf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: 17 }
      - name: Imzo kaliti
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          for H in aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com; do
            K=$(PGPASSWORD="$PW" psql "host=$H port=5432 dbname=postgres user=postgres.$REF sslmode=require connect_timeout=15" -tAc "select android_sign_key from payment_secrets limit 1" 2>/dev/null) && [ -n "$K" ] && break
          done
          [ -n "$K" ] || { echo "::error::kalit topilmadi"; exit 1; }
          echo "::add-mask::$K"
          mkdir -p $RUNNER_TEMP/sign && openssl enc -d -aes-256-cbc -pbkdf2 -in .github/signing/android-signing.enc -pass pass:$K | tar xz -C $RUNNER_TEMP/sign
          SP=$(cat $RUNNER_TEMP/sign/pw.txt); echo "::add-mask::$SP"; echo "SP=$SP" >> $GITHUB_ENV
      - name: Paketlar
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true
      - name: Android loyiha
        run: npx expo prebuild -p android --no-install --clean
      - name: AAB va APK yig'ish (imzolangan)
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          S="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/sign/upload.jks -Pandroid.injected.signing.store.password=$SP -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password=$SP"
          ./gradlew :app:bundleRelease :app:assembleRelease $S --no-daemon -q 2>&1 | tail -40
          mkdir -p ../out
          cp app/build/outputs/bundle/release/app-release.aab ../out/mohir-bozor.aab
          cp app/build/outputs/apk/release/app-release.apk ../out/mohir-bozor.apk
          ls -la ../out
          keytool -printcert -jarfile ../out/mohir-bozor.apk | grep -E "Owner|SHA256" | head -3
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./app.json').expo.version")-$(node -p "require('./app.json').expo.android.versionCode")
          gh release delete "android-$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "android-$V" out/mohir-bozor.aab out/mohir-bozor.apk --title "Android $V" --notes "Play Market uchun: mohir-bozor.aab. Telefonda sinash uchun: mohir-bozor.apk"
          echo "::notice title=Tayyor::https://github.com/${GITHUB_REPOSITORY}/releases/tag/android-$V"
