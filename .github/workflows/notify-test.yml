name: Bildirishnoma sinovi
on:
  push:
    branches: [main]
    paths: ['.github/workflows/notify-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: qtvyjmiqoknpnlilpfpf
    steps:
      - run: |
          set +e
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          for H in aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com; do
            PGPASSWORD="$PW" psql "host=$H port=5432 dbname=postgres user=postgres.$REF sslmode=require connect_timeout=15" -tAc "select 1" >/dev/null 2>&1 && break
          done
          Q() { PGPASSWORD="$PW" psql "host=$H port=5432 dbname=postgres user=postgres.$REF sslmode=require" -tAX -c "$1"; }
          S=$(Q "select secret from notify_settings where id=1"); echo "::add-mask::$S"
          F="https://$REF.supabase.co/functions/v1/notify"
          A=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$F" -H "Content-Type: application/json" -d '{"type":"message","id":0}')
          B=$(curl -s -X POST "$F" -H "Content-Type: application/json" -H "x-notify-secret: $S" -d '{"type":"message","id":0}')
          C=$(curl -s -X POST "$F" -H "Content-Type: application/json" -H "x-notify-secret: $S" -d '{"type":"expiry"}')
          RID=$(Q "select net.http_post(url := '$F', body := jsonb_build_object('type','message','id',0), headers := jsonb_build_object('Content-Type','application/json','x-notify-secret',(select secret from notify_settings where id=1)))")
          sleep 8
          D=$(Q "select status_code || ' ' || coalesce(content,'') || ' ' || coalesce(error_msg,'') from net._http_response where id = $RID")
          echo "::notice title=Natija::kalitsiz=$A | kalit bilan=$B | muddat=$C | pg_net=$D"
