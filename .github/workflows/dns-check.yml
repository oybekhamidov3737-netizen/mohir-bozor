name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for U in https://mohirbozor.uz/ http://mohirbozor.uz/ https://www.mohirbozor.uz/ https://oybek37.github.io/ https://qtvyjmiqoknpnlilpfpf.supabase.co/auth/v1/health; do
            r=$(curl -s -o /tmp/b -w '%{http_code} %{time_total}s %{redirect_url}' -m 20 "$U" 2>&1); echo "::notice title=$U::$r $(head -c 150 /tmp/b | tr '\n' ' ')"
          done
          JS=$(grep -o '/_expo/static/js/web/[^"]*\.js' /tmp/b 2>/dev/null | head -1)
          curl -s https://mohirbozor.uz/ > /tmp/i; JS=$(grep -o '/_expo/static/js/web/[^"]*\.js' /tmp/i | head -1)
          echo "::notice title=js::$JS $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://mohirbozor.uz$JS)"
          echo "::notice title=dns::$(dig +short mohirbozor.uz A | tr '\n' ' ') | www: $(dig +short www.mohirbozor.uz | tr '\n' ' ')"
          echo "::notice title=cert::$(echo | openssl s_client -servername mohirbozor.uz -connect mohirbozor.uz:443 2>/dev/null | openssl x509 -noout -dates -subject 2>&1 | tr '\n' ' ')"
          echo "::notice title=pages::$(curl -s https://www.githubstatus.com/api/v2/components.json | python3 -c "import sys,json;print([ (c['name'],c['status']) for c in json.load(sys.stdin)['components'] if 'Pages' in c['name']])")"
