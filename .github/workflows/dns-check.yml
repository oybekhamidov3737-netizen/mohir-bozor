name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for U in https://didox.uz/ https://www.didox.uz/ https://app.didox.uz/ https://didox.uz/login; do
            r=$(curl -sL -o /tmp/b -w '%{http_code} %{time_total}s %{url_effective}' -m 25 "$U" 2>&1; echo " exit=$?")
            echo "::notice title=$U::$r | $(grep -o '<title>[^<]*' /tmp/b | head -1) | $(grep -oE '(src|href)="[^"]+\.(js|css)"' /tmp/b | head -4 | tr '\n' ' ')"
          done
