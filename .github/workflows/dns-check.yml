name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://mohirbozor.uz/ http://mohirbozor.uz/ https://oybekhamidov3737-netizen.github.io/mohir-bozor/; do
            echo "::notice title=$u::$(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' $u)"
          done
          npm i -g playwright@1.47.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            const errs = [];
            p.on('console', m => { if (m.type() === 'error') errs.push(m.text().slice(0, 200)); });
            p.on('pageerror', e => errs.push('PAGEERR ' + String(e).slice(0, 300)));
            await p.goto('https://mohirbozor.uz/?nointro', { waitUntil: 'load', timeout: 30000 });
            await p.waitForTimeout(8000);
            const t = (await p.evaluate(() => document.body.innerText)).slice(0, 300).replace(/\n/g, ' | ');
            console.log('::notice title=url::' + p.url());
            console.log('::notice title=text::' + t);
            console.log('::notice title=errs::' + errs.join(' || ').slice(0, 1500));
            await b.close();
          })();
          JS
          NODE_PATH=$(npm root -g) node t.js
