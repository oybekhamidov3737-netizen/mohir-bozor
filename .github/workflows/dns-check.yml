name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml', '.github/audit/**']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p out && cd out
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          cp ../.github/audit/shots.js . && node shots.js > shots.txt 2>&1; cat shots.txt; rm -f shots.js
          if [ "${{ contains(github.event.head_commit.message, '[audit]') }}" = "true" ]; then cp ../.github/audit/audit.js . && node audit.js > log.txt 2>&1; tail -60 log.txt; fi
          rm -rf node_modules package*.json audit.js
      - if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/push-results.sh audit out
