name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in http://mohirbozor.uz/ https://mohirbozor.uz/ https://mohirbozor.uz/version.json https://www.mohirbozor.uz/ https://oybekhamidov3737-netizen.github.io/mohir-bozor/ ; do
            r=$(curl -s -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}" "$u" || echo "XATO $?")
            echo "::notice title=$u::q $r"
          done
          echo "::notice title=ver::q $(curl -s -m 20 https://mohirbozor.uz/version.json || curl -s -m 20 http://mohirbozor.uz/version.json)"
