name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    env:
      PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: qtvyjmiqoknpnlilpfpf
    steps:
      - run: |
          sleep 3
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          for H in aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com; do
            R=$(PGPASSWORD="$PW" psql "host=$H port=5432 dbname=postgres user=postgres.$REF sslmode=require connect_timeout=15" -tAF '|' -c "select bot_token, secret from tg_settings where id=1" 2>/dev/null) && [ -n "$R" ] && break
          done
          T="${R%%|*}"; S="${R#*|}"
          echo "::add-mask::$T"; echo "::add-mask::$S"
          A="https://api.telegram.org/bot$T"
          wh=$(curl -s -X POST "$A/setWebhook" -H 'Content-Type: application/json' -d "{\"url\":\"https://$REF.supabase.co/functions/v1/tg-bot\",\"secret_token\":\"$S\",\"allowed_updates\":[\"message\",\"callback_query\"]}")
          cm=$(curl -s -X POST "$A/setMyCommands" -H 'Content-Type: application/json' -d '{"commands":[{"command":"start","description":"Boshlash"},{"command":"savollar","description":"Ko\u2018p so\u2018raladigan savollar"},{"command":"mutaxassis","description":"Mutaxassis bilan bog\u2018lanish"}]}')
          echo "::notice title=info::$(curl -s "$A/getWebhookInfo" | python3 -c "import sys,json;d=json.load(sys.stdin)['result'];print(d.get('allowed_updates'),d.get('pending_update_count'),d.get('last_error_message',''))")"
