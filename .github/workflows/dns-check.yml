name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ ...devices['iPhone 13'] });
            await p.goto('https://my.click.uz/services/pay?service_id=114502&merchant_id=66068&amount=1000&transaction_param=00000000-0000-4000-8000-000000000000', { waitUntil: 'networkidle', timeout: 45000 }).catch(e => console.log('GOTO', e.message));
            await p.waitForTimeout(6000);
            const t = (await p.evaluate(() => document.body.innerText)).replace(/\s+/g, ' ').slice(0, 600);
            console.log('::notice title=click sahifa::' + t);
            await b.close();
          })();
          JS
          node t.js
