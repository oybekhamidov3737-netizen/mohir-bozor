name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          U='https://my.click.uz/services/pay?service_id=114502&merchant_id=66068&amount=1000&transaction_param=00000000-0000-4000-8000-000000000000'
          r=$(curl -sL -m 30 -o /tmp/b -w '%{http_code} %{url_effective}' "$U"); echo "::notice title=click page::$r"
          python3 - <<'PY'
          import re,html
          s=open('/tmp/b',encoding='utf8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S); t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          print('::notice title=click text::'+t[:700])
          PY
