name: DNS tekshirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dns-check.yml']
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(dig +short NS uz. | head -1)
          echo "::notice title=tld::v $T"
          echo "::notice title=deleg::v $(dig +norec NS mohirbozor.uz @$T | grep -E 'NS|status' | tr '\n' ' ' | cut -c1-400)"
          echo "::notice title=pscloud::v $(dig +short A mohirbozor.uz @ns1.pscloud.uz | tr '\n' ' ')"
          echo "::notice title=google::v $(dig +short A mohirbozor.uz @8.8.8.8 | tr '\n' ' ')"
          echo "::notice title=cf::v $(dig +short A mohirbozor.uz @1.1.1.1 | tr '\n' ' ')"
