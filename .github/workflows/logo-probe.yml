name: Logo qidirish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/logo-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in payme_color payme_white; do
            curl -s "https://cdn.payme.uz/logo/$n.svg" -o f.svg
            echo "::notice title=$n::$(base64 -w0 f.svg)"
          done
