name: Veb-sayt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketlarni o'rnatish
        run: npm install --no-audit --no-fund
      - name: Expo versiyalarini moslashtirish
        run: npx expo install --fix || true
      - name: Saytni yig'ish
        run: |
          set -o pipefail
          npx expo export -p web 2>&1 | tee build.log
      - name: Xatoni ko'rsatish
        if: failure()
        run: |
          echo "::error title=Build log::$(tail -n 60 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
      - name: GitHub Pages uchun tayyorlash
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
