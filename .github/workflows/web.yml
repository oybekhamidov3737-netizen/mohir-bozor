name: Veb-sayt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketlarni o'rnatish
        run: npm install --no-audit --no-fund
      - name: Expo versiyalarini moslashtirish
        run: |
          npx expo install --fix || true
          git diff -U0 package.json | grep '^[-+] ' | sed 's/^/::notice title=Versiya tuzatildi::/' || true
      - name: Saytni yig'ish
        run: |
          set -o pipefail
          export EXPO_PUBLIC_BUILD="${GITHUB_SHA::7}"
          npx expo export -p web 2>&1 | tee build.log
      - name: Xatoni ko'rsatish
        if: failure()
        run: |
          echo "::error title=Build log::$(tail -n 60 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
      - name: GitHub Pages uchun tayyorlash
        run: |
          cp -n public/* dist/ 2>/dev/null || true
          sed -i 's#</head>#<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mohir bozor"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>#' dist/index.html
          grep -c apple-touch-icon dist/index.html
          cp dist/index.html dist/404.html
          echo "{\"build\":\"${GITHUB_SHA::7}\"}" > dist/version.json
          touch dist/.nojekyll
          echo 'mohirbozor.uz' > dist/CNAME
      - name: gh-pages tarmog'iga joylash
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sayt: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
