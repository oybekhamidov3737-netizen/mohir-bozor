name: Pochta sozlash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth.yml'
      - 'supabase/emails/**'
  workflow_dispatch:

jobs:
  smtp:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_TOKEN }}
      GMAIL: ${{ secrets.GMAIL_LOGIN }}
      REF: qtvyjmiqoknpnlilpfpf
      SITE: https://oybekhamidov3737-netizen.github.io/mohir-bozor/
    steps:
      - uses: actions/checkout@v4
      - name: Sozlamalarni yuborish
        run: |
          if [ -z "$TOKEN" ] || [ -z "$GMAIL" ]; then
            echo "::warning title=Maxfiy qiymat yo'q::SUPABASE_TOKEN yoki GMAIL_LOGIN hali qo'shilmagan"
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, urllib.request
          login = os.environ["GMAIL"].strip().replace(" ", "")
          email, _, pw = login.partition(":")
          if "@" not in email or len(pw) < 10:
              print("::error title=GMAIL_LOGIN noto'g'ri::Format: gmail@gmail.com:ilovaparoli (bo'sh joysiz)")
              raise SystemExit(1)
          code = open("supabase/emails/code.html").read()
          body = {
            "site_url": os.environ["SITE"],
            "uri_allow_list": "https://oybekhamidov3737-netizen.github.io/**,mohir://**",
            "smtp_admin_email": email,
            "smtp_sender_name": "Mohir bozor",
            "smtp_host": "smtp.gmail.com",
            "smtp_port": "465",
            "smtp_user": email,
            "smtp_pass": pw,
            "rate_limit_email_sent": 100,
            "mailer_otp_length": 6,
            "mailer_subjects_confirmation": "Mohir bozor: tasdiqlash kodi {{ .Token }}",
            "mailer_templates_confirmation_content": code,
            "mailer_subjects_magic_link": "Mohir bozor: kirish kodi {{ .Token }}",
            "mailer_templates_magic_link_content": code,
          }
          req = urllib.request.Request(
            f"https://api.supabase.com/v1/projects/{os.environ['REF']}/config/auth",
            data=json.dumps(body).encode(), method="PATCH",
            headers={"Authorization": "Bearer " + os.environ["TOKEN"].strip(), "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("::notice title=Pochta tayyor::Gmail orqali yuborish va kodli xat shablonlari o'rnatildi")
          except urllib.error.HTTPError as e:
              msg = e.read().decode()[:400].replace("\n", " ")
              print(f"::error title=Supabase xatosi {e.code}::{msg}")
              raise SystemExit(1)
          EOF
