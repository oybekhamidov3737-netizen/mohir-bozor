name: Ilova yig'ish (Android / iPhone)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Qaysi telefon uchun"
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "preview = sinov uchun APK, production = do'konga topshirish uchun"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Expo va EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Paketlarni o'rnatish
        run: npm install --no-audit --no-fund
      - name: Expo versiyalarini moslashtirish
        run: npx expo install --fix || true
      - name: EAS loyihasini ulash
        run: eas init --non-interactive --force
      - name: Yig'ishni boshlash
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
